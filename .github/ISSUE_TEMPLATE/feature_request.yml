name: 💡 Feature idea
description: Suggest a new feature or an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is it for, and what can't they do today?
      placeholder: Players can't save games they want to buy later.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Mockups and sketches are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      options:
        - Yes, I'd like to work on this
        - Maybe, with some guidance
        - No, just suggesting
    validations:
      required: true
